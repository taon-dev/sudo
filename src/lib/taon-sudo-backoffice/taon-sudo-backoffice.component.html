@if (!componentLoaded) {
  <code class="pb-2">
    Welcome to SUDO backoffice. You have full raw access to the whole system
    and database here. Be careful!
  </code>
  <br>
  <mat-card class="mt-4">
    <mat-card-header>
      <mat-card-subtitle>WEBSQL MODE</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-checkbox
        [disabled]="!isWebSQLMode"
        [ngModel]="taonAdminService.keepWebsqlDbDataAfterReload()"
        (change)="
          taonAdminService.keepWebsqlDbDataAfterReload.set($event.checked)
        ">
        Don't remove data when re-loading
      </mat-checkbox>
    </mat-card-content>
  </mat-card>
}

<router-outlet
  (activate)="onRouteActivate($event)"
  (deactivate)="onRouteDeactivate($event)"></router-outlet>
